#!/usr/bin/env bash
# bundles.conf — sourced by make-bundles.sh

# --- defaults (override by editing or via env) -------------------------------
SOURCE_APP="${SOURCE_APP:-/Applications/Chromium.app}"
INSTALL_DIR="${INSTALL_DIR:-/Applications}"
PROFILES_DIR="${PROFILES_DIR:-${HOME}/ChromiumProfiles}"
BUNDLE_ID_PREFIX="${BUNDLE_ID_PREFIX:-com.adrian.chromium}"
APP_NAME_PREFIX="${APP_NAME_PREFIX:-chromium}"

# --- bundles -----------------------------------------------------------------
# Format per entry: "key|display_name|workspace"
#   key          - identifier; produces <APP_NAME_PREFIX>-<key>.app
#                                   and <BUNDLE_ID_PREFIX>-<key> bundle id
#   display_name - shown in Dock and menu bar (optional)
#   workspace    - AeroSpace workspace for the printed rule (optional)
BUNDLES=(
  "soracom-design-system-astro|Soracom Design System|4_Design_System"
  "user-console-monorepo|User Console Monorepo|6_User_Console"
  "soracom-design-mockups|Soracom Design Mockups|7_Mockups"
)
